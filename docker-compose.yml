services:
  inference-gate:
    build: .
    ports:
      - "11435:11435"
    pid: host           # required so gpustat can see host process names
    environment:
      - UPSTREAM_URL=${UPSTREAM_URL:-http://ollama:11434}
      - HIGH_PRIORITY_UTIL_THRESHOLD=${HIGH_PRIORITY_UTIL_THRESHOLD:-80}
      - IGNORED_GPU_PROCESSES=${IGNORED_GPU_PROCESSES:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility,compute
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
